<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Платформа тестувань</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Зверни увагу: підключаємо output.css, якого ще немає, ми його згенеруємо -->
    <link rel="stylesheet" href="output.css">
</head>
<body class="min-h-screen py-4 px-2 sm:px-4">
     
<!-- СТАРТОВИЙ ЕКРАН АВТОРИЗАЦІЇ УЧНЯ -->
<div id="student-auth-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4" style="background: rgba(2, 6, 23, 0.92); backdrop-filter: blur(16px);">
    <div style="width: 100%; max-width: 420px; background: #0f172a; border: 1px solid #1e293b; border-radius: 16px; padding: 28px 24px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);" class="text-center">
        
        <div style="display: inline-block; padding: 4px 12px; border-radius: 9999px; background: rgba(6, 182, 212, 0.1); border: 1px solid rgba(6, 182, 212, 0.3); color: #22d3ee; font-size: 11px; margin-bottom: 14px;" class="font-mono">
            OS Explorer • Тестування
        </div>
        
        <h2 style="font-size: 20px; font-weight: 700; color: #ffffff; margin-bottom: 6px;">
            Представтеся, будь ласка
        </h2>
        <p style="font-size: 12px; color: #94a3b8; line-height: 1.5; margin-bottom: 20px;">
            Введіть ваше прізвище та ім'я, щоб відкрити завдання та зафіксувати результат
        </p>
        
        <div style="text-align: left; margin-bottom: 16px;">
            <label for="student-name-input" style="display: block; font-size: 11px; color: #cbd5e1; margin-bottom: 6px; font-weight: 500;">
                Прізвище та ім'я
            </label>
            <input type="text" id="student-name-input" placeholder="Наприклад: Петренко Олександр" 
                   style="width: 100%; background: #020617; border: 1px solid #334155; border-radius: 10px; padding: 11px 14px; font-size: 14px; color: #ffffff; outline: none; transition: border-color 0.2s;"
                   onfocus="this.style.borderColor='#06b6d4'"
                   onblur="this.style.borderColor='#334155'"
                   autocomplete="name">
            <p id="student-name-error" class="hidden" style="color: #f87171; font-size: 11px; margin-top: 6px;">
                ⚠️ Введіть прізвище та ім'я (мінімум 3 символи)
            </p>
        </div>
        
        <button id="startTestBtn" style="width: 100%; background: #0891b2; color: #ffffff; font-weight: 700; padding: 12px 16px; border-radius: 10px; font-size: 13px; border: none; cursor: pointer; box-shadow: 0 0 20px rgba(6, 182, 212, 0.25); transition: background 0.2s;"
                onmouseover="this.style.background='#06b6d4'"
                onmouseout="this.style.background='#0891b2'">
            Розпочати тест →
        </button>
    </div>
</div>

    <div class="max-w-4xl mx-auto space-y-4">
        <header id="main-header" class="text-center mb-6"></header>
        <div id="app-container" class="space-y-4"></div>

        <div id="controls-container" class="flex flex-col sm:flex-row gap-3 justify-center pt-2 pb-6 hidden">
            <button id="submitBtn" class="bg-cyan-600 hover:bg-cyan-500 text-white px-6 py-2 rounded text-xs font-bold shadow-[0_0_15px_rgba(0,242,254,0.3)] transition-all active:scale-95 w-full sm:w-auto">
                Завершити та перевірити
            </button>
        </div>

        <div id="result-box" class="hidden glass-panel p-4 text-center border border-cyan-500/30 mb-8">
            <h3 class="text-sm font-bold text-white mb-1">Ваш результат</h3>
            <div class="text-3xl font-extrabold neon-text-cyan mb-1" id="final-score">0 / 100</div>
            <p id="feedback-msg" class="text-xs text-slate-300"></p>
            <p id="save-status-msg" class="text-[11px] font-mono text-slate-400 mt-2"></p>
        </div>
    </div>
    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
